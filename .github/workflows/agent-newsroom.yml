name: MUNDI — agents via API (secours manuel, payant)

on:
  # 24/11/2026 : décision du fondateur, plus d'appel API automatique. La rédaction
  # passe par des tâches planifiées sur l'abonnement Claude Max (voir
  # docs/AGENT_NEWSROOM.md). Ce workflow reste un SECOURS, lancé uniquement à la main.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mundi-daily-agents
  cancel-in-progress: false

jobs:
  newsroom:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout code from main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests for newsroom roles and checker
        run: node --test tests/agents-newsroom.test.mjs tests/agent-providers.test.mjs tests/autopublish.test.mjs
      - name: Checkout separate stock archive
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin refs/heads/editorial-stock:refs/remotes/origin/editorial-stock
          git worktree add --detach "$RUNNER_TEMP/mundi-editorial-stock" origin/editorial-stock
          mkdir -p reports
          if [ -f "$RUNNER_TEMP/mundi-editorial-stock/editorial/library/candidates.json" ]; then
            cp "$RUNNER_TEMP/mundi-editorial-stock/editorial/library/candidates.json" reports/editorial-stock.json
          else
            printf '{"format":"mundi-candidate-stock-v1","items":[]}\n' > reports/editorial-stock.json
          fi
          if [ -f "$RUNNER_TEMP/mundi-editorial-stock/editorial/agents/ledger.json" ]; then
            cp "$RUNNER_TEMP/mundi-editorial-stock/editorial/agents/ledger.json" reports/agents-history.json
          fi
      - name: Prepare 12 journalists and 12 professors' assignments (with alternates)
        run: node scripts/plan-newsroom.mjs
      - name: Research originals and second-pass fact check (only with API secret)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MUNDI_AGENT_PROVIDER: ${{ vars.MUNDI_AGENT_PROVIDER }}
          MUNDI_CHECKER_PROVIDER: ${{ vars.MUNDI_CHECKER_PROVIDER }}
          MUNDI_AGENT_MODEL: ${{ vars.MUNDI_AGENT_MODEL }}
          MUNDI_CHECKER_MODEL: ${{ vars.MUNDI_CHECKER_MODEL }}
          MUNDI_AGENTS_PER_DAY: ${{ vars.MUNDI_AGENTS_PER_DAY || '24' }}
          MUNDI_AGENT_MAX_ATTEMPTS: ${{ vars.MUNDI_AGENT_MAX_ATTEMPTS || '3' }}
          MUNDI_AGENT_CONCURRENCY: ${{ vars.MUNDI_AGENT_CONCURRENCY || '6' }}
        run: node scripts/run-newsroom-agents.mjs
      - name: Update internal research ledger only
        env:
          MUNDI_AGENT_HISTORY: ${{ runner.temp }}/mundi-editorial-stock/editorial/agents/ledger.json
        run: node scripts/agent-ledger.mjs
      - name: Archive each day's private drafts and checker reports
        shell: bash
        run: |
          set -euo pipefail
          DAY=$(node -p "require('./reports/agents-results.json').date")
          if ! [[ "$DAY" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then
            echo "Invalid date"; exit 1
          fi
          mkdir -p "$RUNNER_TEMP/mundi-editorial-stock/editorial/agents/days"
          cp reports/agents-results.json "$RUNNER_TEMP/mundi-editorial-stock/editorial/agents/days/$DAY.json"
          cp reports/agents-plan.json "$RUNNER_TEMP/mundi-editorial-stock/editorial/agents/days/$DAY-plan.json"
      - name: Persist ledger to isolated editorial-stock branch
        shell: bash
        run: |
          set -euo pipefail
          git -C "$RUNNER_TEMP/mundi-editorial-stock" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/mundi-editorial-stock" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RUNNER_TEMP/mundi-editorial-stock" add editorial/agents/ledger.json editorial/agents/days/
          if git -C "$RUNNER_TEMP/mundi-editorial-stock" diff --cached --quiet; then
            echo "No processed tasks to archive"
          else
            git -C "$RUNNER_TEMP/mundi-editorial-stock" commit -m "agents: record investigated briefs for deduplication"
            # The editorial inbox writes candidates to this SAME private branch.
            # Refresh/rebase before pushing; do not force-push or erase research stock.
            for attempt in 1 2 3 4; do
              git -C "$RUNNER_TEMP/mundi-editorial-stock" fetch origin refs/heads/editorial-stock:refs/remotes/origin/editorial-stock
              git -C "$RUNNER_TEMP/mundi-editorial-stock" rebase origin/editorial-stock
              if git -C "$RUNNER_TEMP/mundi-editorial-stock" push origin HEAD:refs/heads/editorial-stock; then
                echo "Agents archive persisted, attempt $attempt"
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo "::error::Private stock push failed after 4 rebase attempts; publication blocked to preserve audit trail."
                exit 1
              fi
              sleep 2
            done
          fi
      # V2 (#43), décidée par le fondateur : publication automatique des seuls brouillons validés
      # par le vérificateur, non sensibles, aux liens joignables. Interrupteur d'urgence :
      # variable de dépôt MUNDI_AUTOPUBLISH=off. Plafond : MUNDI_PUBLISH_PER_DAY (défaut 24, max 24).
      - name: Select drafts that may be auto-published
        env:
          MUNDI_AUTOPUBLISH: ${{ vars.MUNDI_AUTOPUBLISH }}
          MUNDI_PUBLISH_PER_DAY: ${{ vars.MUNDI_PUBLISH_PER_DAY || '24' }}
        run: node scripts/autopublish-agents.mjs
      - name: Validate, build and publish to main
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- content/publications.json; then
            echo "No publication today."
            exit 0
          fi
          npm ci
          node scripts/validate-editorial.mjs
          npm run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Recontrôle contre le main le plus récent (lots concurrents), puis écriture (#125).
          scripts/publish-to-main.sh "agents: publication automatique vérifiée par l'IA"
      - name: Batch report (blocked duplicates, reviews, Aujourd'hui selection)
        if: always()
        run: node scripts/batch-report.mjs || true
      - name: Upload private agent newsroom files (14 days)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mundi-agents-daily-newsroom
          path: |
            reports/agents-plan.json
            reports/agents-results.json
            reports/autopublish.json
            reports/insertion.json
            reports/lot.md
          retention-days: 14
          if-no-files-found: warn
