name: MUNDI — échantillons de voix gratuites (temporaire)
on:
  push:
    branches: [claude/project-thread-ckowvv]
    paths: ['.github/workflows/audio-sample.yml', 'scripts/audio-narration.mjs']
permissions:
  contents: write
jobs:
  samples:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Texte de l'article
        run: node -e "import('./scripts/audio-narration.mjs').then(m=>{const a=require('./content/publications.json').filter(p=>p.status==='published')[0];require('fs').writeFileSync('narration.txt',m.narrationFor(a))})" && cat narration.txt
      - name: Outils
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg espeak-ng
          pip install -q piper-tts
          pip install -q --extra-index-url https://download.pytorch.org/whl/cpu torch kokoro soundfile "misaki[fr]" || echo "kokoro indisponible"
      - name: Piper
        run: |
          mkdir -p samples voices
          cd voices
          for v in fr_FR-siwis-medium fr_FR-upmc-medium fr_FR-mls-medium; do python -m piper.download_voices $v || true; done
          cd ..
          python -m piper -m voices/fr_FR-siwis-medium.onnx -f samples/piper-siwis.wav --length-scale 1.05 --sentence-silence 0.35 < narration.txt || true
          python -m piper -m voices/fr_FR-upmc-medium.onnx -s 0 -f samples/piper-upmc-jessica.wav --length-scale 1.05 --sentence-silence 0.35 < narration.txt || true
          python -m piper -m voices/fr_FR-mls-medium.onnx -f samples/piper-mls.wav --sentence-silence 0.35 < narration.txt || true
      - name: Kokoro
        continue-on-error: true
        run: |
          python - <<'PY'
          from kokoro import KPipeline
          import soundfile as sf, numpy as np
          text=open("narration.txt").read()
          pipe=KPipeline(lang_code="f")
          chunks=[a for _,_,a in pipe(text, voice="ff_siwis", speed=0.95, split_pattern=r"\n\n+")]
          gap=np.zeros(int(24000*0.4))
          out=np.concatenate([np.concatenate([c, gap]) for c in chunks])
          sf.write("samples/kokoro-siwis.wav", out, 24000)
          PY
      - name: MP3 et envoi sur la branche
        run: |
          cd samples
          for f in *.wav; do ffmpeg -loglevel error -y -i "$f" -af "loudnorm=I=-16:TP=-1.5" -ac 1 -b:a 64k "${f%.wav}.mp3"; done
          rm -f *.wav; ls -la
          cd ..
          mkdir -p tmp-audio-samples && mv samples/*.mp3 tmp-audio-samples/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tmp-audio-samples && git commit -m "temp: échantillons de voix" && git push origin HEAD:claude/project-thread-ckowvv
