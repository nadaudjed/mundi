name: MUNDI — édition du jour après minuit (Paris)

# Le site est statique (#125) : sans nouveau commit, l'accueil construit la veille resterait
# « Aujourd'hui ». Juste après minuit à Paris, ce workflow déclenche un nouveau build Netlify
# (crochet de déploiement, secret NETLIFY_BUILD_HOOK), puis vérifie que le site servi porte bien
# la date du jour. Sans le secret, il le signale ; le navigateur affiche de toute façon
# « Dernière édition » dès que minuit est passé (lib/use-edition-day.ts). Aucun appel payant.
on:
  schedule:
    - cron: '2 23 * * *'   # 00h02 Paris en hiver
    - cron: '2 22 * * *'   # 00h02 Paris en été (23h02 en hiver : build sans effet)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mundi-edition-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Only after midnight in Paris
        id: when
        run: |
          H=$(TZ=Europe/Paris date +%H)
          if [ "$H" = "00" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; echo "Pas minuit à Paris ($H h) : rien à faire."; fi
      - name: Trigger a Netlify build
        if: steps.when.outputs.go == 'true'
        env:
          HOOK: ${{ secrets.NETLIFY_BUILD_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::Secret NETLIFY_BUILD_HOOK absent : ajouter un crochet de déploiement Netlify (Site configuration > Build hooks) dans les secrets du dépôt."
            exit 0
          fi
          curl -fsS -X POST -d '{}' "$HOOK" > /dev/null
          echo "Build Netlify demandé."
          sleep 240
      - name: Verify the served edition date
        if: steps.when.outputs.go == 'true'
        env:
          MUNDI_CHECK_EDITION: "1"
        run: node scripts/check-live-netlify.mjs
