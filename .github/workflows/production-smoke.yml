name: MUNDI — Netlify production smoke test

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/publications.json'
      - 'scripts/check-live-netlify.mjs'
      - '.github/workflows/production-smoke.yml'
  schedule:
    - cron: '15 12 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current publications
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests for production checker
        run: node --test tests/production-smoke.test.mjs
      - name: Verify real Netlify deployment and latest public story
        run: node scripts/check-live-netlify.mjs
      - name: Upload availability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mundi-production-smoke
          path: reports/production-smoke.json
          retention-days: 14
          if-no-files-found: warn
