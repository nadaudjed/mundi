name: MUNDI — contrôle de production (Cloudflare Workers)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'content/publications.json'
      - 'scripts/check-live-site.mjs'
      - '.github/workflows/production-smoke.yml'
      - 'wrangler.jsonc'
      - 'worker/**'
      - 'scripts/cloudflare-files.mjs'
  schedule:
    - cron: '15 12 * * *'

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout current publications
        uses: actions/checkout@v4
      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Unit tests for production checker
        run: node --test tests/production-smoke.test.mjs
      - name: Verify the official Cloudflare address and latest public story
        env:
          MUNDI_SITE_URL: ${{ vars.MUNDI_SITE_URL }}
          # Après une fusion sur main : la version servie doit être ce commit (déployé par Workers Builds).
          MUNDI_EXPECT_COMMIT: ${{ github.event_name == 'push' && github.sha || '' }}
        run: node scripts/check-live-site.mjs
      - name: Upload availability report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mundi-production-smoke
          path: reports/production-smoke.json
          retention-days: 14
          if-no-files-found: warn
