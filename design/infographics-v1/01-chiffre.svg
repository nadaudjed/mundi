<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="ttl desc">
<title id="ttl">MUNDI — une montagne invisible, maquette du chiffre 2,3 millions de tonnes</title>
<desc id="desc">Brouillon graphique non publié. Selon Eurostat, 2,3 millions de tonnes de déchets textiles ont été générés dans l'Union européenne en 2024. Ce chiffre ne désigne ni le recyclage ni les textiles collectés.</desc>
<defs>
<linearGradient id="night" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101D30"/><stop offset="1" stop-color="#071422"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8EF5DC"/><stop offset="1" stop-color="#20B99A"/></linearGradient>
<linearGradient id="haze" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#246BCE" stop-opacity=".35"/><stop offset="1" stop-color="#20B99A" stop-opacity=".02"/></linearGradient>
</defs>
<rect width="1080" height="1920" fill="url(#night)"/>
<circle cx="865" cy="770" r="470" fill="url(#haze)"/>
<g opacity=".27" fill="none" stroke-linecap="round">
<path d="M-140 1120 C 250 410, 410 1760, 1130 580" stroke="#20B99A" stroke-width="8"/>
<path d="M-110 1158 C 270 450, 440 1800, 1160 620" stroke="#72E9D2" stroke-width="3"/>
<path d="M-90 1194 C 290 490, 475 1840, 1190 665" stroke="#246BCE" stroke-width="12"/>
<path d="M-68 1227 C 320 520, 500 1880, 1220 700" stroke="#F3F0E8" stroke-width="2"/>
</g>
<text x="88" y="130" font-family="DM Sans,Arial,sans-serif" font-size="70" font-weight="800" letter-spacing="3" fill="#F3F0E8">MUNDI</text>
<text x="90" y="181" font-family="DM Sans,Arial,sans-serif" font-size="23" font-weight="650" letter-spacing="7" fill="#A8B9CA">COMPRENDRE LE MONDE</text>
<rect x="762" y="77" width="230" height="68" rx="34" fill="#21354E" stroke="#47617C"/>
<text x="877" y="122" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#A8F1DC">01 / 03</text>
<text x="90" y="325" font-family="DM Sans,Arial,sans-serif" font-size="29" font-weight="750" letter-spacing="7" fill="#8EF5DC">L’EUROPE ET SES TEXTILES</text>
<text x="86" y="436" font-family="Fraunces,Georgia,serif" font-size="92" font-weight="650" fill="#F3F0E8">Une montagne</text>
<text x="86" y="545" font-family="Fraunces,Georgia,serif" font-size="92" font-style="italic" font-weight="580" fill="#F3F0E8">invisible.</text>
<text x="68" y="932" font-family="Fraunces,Georgia,serif" font-size="328" font-weight="700" letter-spacing="-14" fill="url(#mint)">2,3</text>
<text x="94" y="1017" font-family="DM Sans,Arial,sans-serif" font-size="59" font-weight="800" letter-spacing="1.3" fill="#F3F0E8">MILLIONS DE TONNES</text>
<text x="95" y="1090" font-family="DM Sans,Arial,sans-serif" font-size="39" fill="#C6D5E1">de déchets textiles générés</text>
<text x="95" y="1142" font-family="DM Sans,Arial,sans-serif" font-size="39" fill="#C6D5E1">dans l’UE en 2024.</text>
<rect x="76" y="1305" width="928" height="269" rx="34" fill="#152B3C" stroke="#466578" stroke-width="2"/>
<rect x="111" y="1346" width="7" height="170" rx="3" fill="#20B99A"/>
<text x="150" y="1411" font-family="DM Sans,Arial,sans-serif" font-size="39" font-weight="700" fill="#F3F0E8">Attention au chiffre.</text>
<text x="150" y="1472" font-family="DM Sans,Arial,sans-serif" font-size="31" fill="#C6D5E1">Il mesure les déchets générés,</text>
<text x="150" y="1517" font-family="DM Sans,Arial,sans-serif" font-size="31" fill="#C6D5E1">pas la quantité recyclée.</text>
<line x1="80" y1="1670" x2="1000" y2="1670" stroke="#57738A" opacity=".55"/>
<text x="88" y="1731" font-family="DM Sans,Arial,sans-serif" font-size="25" font-weight="700" fill="#B6CDDB">SOURCE : EUROSTAT · 12.11.2026</text>
<text x="88" y="1781" font-family="DM Sans,Arial,sans-serif" font-size="23" fill="#91A5B5">Périmètre : Union européenne · année 2024</text>
<rect x="80" y="1820" width="920" height="60" rx="30" fill="#F3F0E8" opacity=".95"/>
<text x="540" y="1859" font-family="DM Sans,Arial,sans-serif" font-size="24" font-weight="800" letter-spacing="4" text-anchor="middle" fill="#101D30">MAQUETTE INTERNE — NON PUBLIÉE</text>
</svg>