<text x="123" y="1480" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="3" fill="#8EF5DC">LE CADRE CHANGE</text>
<text x="123" y="1542" font-family="DM Sans,Arial,sans-serif" font-size="34" font-weight="700" fill="#F3F0E8">L’UE a révisé sa directive déchets</text>
<text x="123" y="1590" font-family="DM Sans,Arial,sans-serif" font-size="29" fill="#C3D4DF">en vigueur depuis le 16 octobre 2025.</text>
