<text x="87" y="540" font-family="Fraunces,Georgia,serif" font-size="88" font-weight="650" font-style="italic" fill="#F3F0E8">nos textiles ?</text>
<rect x="126" y="656" width="828" height="165" rx="38" fill="#F3F0E8"/>
<text x="540" y="716" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="26" font-weight="800" letter-spacing="4" fill="#246BCE">ÉTAPE ESSENTIELLE</text>
<text x="540" y="778" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="56" font-weight="700" fill="#101D30">Collecter et trier</text>
