<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920" role="img" aria-labelledby="ttl desc">
<title id="ttl">MUNDI — les étapes du devenir des textiles et le cadre européen</title>
<desc id="desc">Infographie conceptuelle non exhaustive et non à l'échelle, montrant que la collecte et le tri permettent ensuite le réemploi ou le recyclage des textiles. Une révision de la directive-cadre européenne sur les déchets est entrée en vigueur le 16 octobre 2025. Les résultats ne sont pas garantis.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152844"/><stop offset="1" stop-color="#081729"/></linearGradient>
<linearGradient id="loop" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#20B99A"/><stop offset="1" stop-color="#246BCE"/></linearGradient>
</defs>
<rect width="1080" height="1920" fill="url(#bg)"/>
<g stroke="#31465C" stroke-width="2" fill="none" opacity=".7">
<circle cx="1003" cy="1060" r="500"/><circle cx="1003" cy="1060" r="630"/><circle cx="1003" cy="1060" r="760"/>
</g>
