<rect x="558" y="975" width="422" height="250" rx="36" fill="#17375A" stroke="#447DDD" stroke-width="3"/>
<text x="320" y="1061" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="3" fill="#8EF5DC">VOIE POSSIBLE</text>
<text x="320" y="1134" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="55" fill="#F3F0E8">Réemploi</text>
<text x="769" y="1061" text-anchor="middle" font-family="DM Sans,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="3" fill="#9BC3FF">VOIE POSSIBLE</text>
<text x="769" y="1134" text-anchor="middle" font-family="Fraunces,Georgia,serif" font-size="54" fill="#F3F0E8">Recyclage</text>
<text x="92" y="1308" font-family="DM Sans,Arial,sans-serif" font-size="28" fill="#AFBFCE">Schéma simplifié, non exhaustif,</text>
<text x="92" y="1348" font-family="DM Sans,Arial,sans-serif" font-size="28" fill="#AFBFCE">sans proportions ni rendement implicite.</text>
