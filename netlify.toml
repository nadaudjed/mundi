# Configuration de build pour Netlify (aperçus et, plus tard, production).
# Aucun secret ni variable d'environnement n'est nécessaire.
[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "22"

# Les récits de démonstration ont été retirés : leurs anciennes adresses mènent à Explorer.
[[redirects]]
  from = "/recit/*"
  to = "/explorer/"
  status = 301
